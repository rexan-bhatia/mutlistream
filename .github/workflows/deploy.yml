name: MusicStream CI/CD

on:
push:
branches:
- main

jobs:
test:
name: Run Tests
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r backend/requirements.txt

  - name: Run tests
    run: |
      pytest


deploy:
name: Deploy to EC2
needs: test
runs-on: ubuntu-latest

steps:
  - name: Deploy application
    uses: appleboy/ssh-action@v1.2.0
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_KEY }}
      port: 22
      timeout: 30s
      command_timeout: 10m

      script: |
        set -e

        echo "========================================"
        echo "Starting MusicStream deployment"
        echo "========================================"

        cd ~/mutlistream

        echo "Pulling latest code..."
        git fetch origin
        git reset --hard origin/main

        echo "Current commit:"
        git rev-parse --short HEAD

        echo "Activating virtual environment..."
        source .venv/bin/activate

        echo "Installing dependencies..."
        python -m pip install -r backend/requirements.txt

        echo "Restarting MusicStream service..."
        sudo systemctl restart musicstream

        echo "Waiting for MusicStream to become healthy..."

        for i in {1..30}; do

          echo "----------------------------------------"
          echo "Health check attempt $i/30"
          echo "----------------------------------------"

          if sudo systemctl is-active --quiet musicstream; then
            echo "MusicStream service: ACTIVE"
          else
            echo "MusicStream service: NOT ACTIVE"
          fi

          if curl -sSf \
            --connect-timeout 2 \
            --max-time 5 \
            http://127.0.0.1:8083/api/status \
            > /tmp/musicstream_health.json; then

            echo "Health check passed!"
            cat /tmp/musicstream_health.json
            echo ""

            echo "========================================"
            echo "Deployment successful!"
            echo "========================================"

            exit 0
          fi

          echo "Application is not ready yet."
          sleep 2

        done

        echo "========================================"
        echo "DEPLOYMENT FAILED"
        echo "========================================"

        echo ""
        echo "===== SYSTEMD STATUS ====="
        sudo systemctl status musicstream --no-pager -l || true

        echo ""
        echo "===== APPLICATION LOGS ====="
        sudo journalctl -u musicstream -n 100 --no-pager || true

        echo ""
        echo "===== PORT 8083 ====="
        sudo ss -lntp | grep 8083 || true

        echo ""
        echo "===== FINAL CURL TEST ====="
        curl -v http://127.0.0.1:8083/api/status || true

        exit 1
     fi

      echo ""
      echo "========================================"
      echo "DEPLOYMENT SUCCESSFUL"
      echo "========================================"



